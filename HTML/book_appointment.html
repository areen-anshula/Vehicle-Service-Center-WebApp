
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoPulse | Book Appointment</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body class="min-h-screen bg-[#f5f5f5] font-sans text-[#171717]">
    <header class="sticky top-0 z-50 flex min-h-[70px] items-center bg-black px-4 py-3 shadow-md md:px-[6%]">
        <a href="#" aria-label="AutoPulse Home">
            <img src="../MEDIA/AutoPulse Automotive Service Logo.png" alt="AutoPulse Logo" class="w-[110px] md:w-[125px]">
        </a>
    </header>
    <main class="mx-auto mt-6 w-full max-w-7xl p-3 sm:p-5">
        <form action="#" method="POST" class="space-y-4">
            <!-- VEHICLE INFORMATION -->
            <section class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
                <h2 class="mb-4 flex items-center gap-2 text-base font-bold">
                    <i class="fa-solid fa-car text-lg text-orange-500"></i>
                    Vehicle Information
                </h2>
                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
                    <div>
                        <label for="registration" class="mb-1.5 block text-xs font-semibold">Vehicle Registration Number <span class="text-red-500">*</span></label>
                        <div class="flex h-10 items-center gap-2 rounded-lg border border-gray-300 px-3 focus-within:border-orange-500">
                            <i class="fa-solid fa-car-side text-gray-400"></i>
                            <input type="text" id="registration" name="registration" placeholder="Enter registration number" required class="w-full bg-transparent text-xs uppercase outline-none placeholder:normal-case">
                        </div>
                    </div>
                    <div>
                        <label for="brand" class="mb-1.5 block text-xs font-semibold">Brand <span class="text-red-500">*</span></label>
                        <select id="brand" name="brand" required class="h-10 w-full rounded-lg border border-gray-300 bg-white px-3 text-xs outline-none focus:border-orange-500">
                            <option value="" disabled selected>Select Brand</option>
                            <option value="BMW">BMW</option>
                            <option value="Mercedes-Benz">Mercedes-Benz</option>
                            <option value="Audi">Audi</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Honda">Honda</option>
                            <option value="Nissan">Nissan</option>
                            <option value="Hyundai">Hyundai</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label for="model" class="mb-1.5 block text-xs font-semibold">Model <span class="text-red-500">*</span></label>
                        <input type="text" id="model" name="model" placeholder="Enter vehicle model" required class="h-10 w-full rounded-lg border border-gray-300 px-3 text-xs outline-none focus:border-orange-500">
                    </div>
                    <div>
                        <label for="year" class="mb-1.5 block text-xs font-semibold">Manufacturing Year <span class="text-red-500">*</span></label>
                        <select id="year" name="year" required class="h-10 w-full rounded-lg border border-gray-300 bg-white px-3 text-xs outline-none focus:border-orange-500">
                            <option value="" disabled selected>Select Year</option>
                            <option>2026</option>
                            <option>2025</option>
                            <option>2024</option>
                            <option>2023</option>
                            <option>2022</option>
                            <option>2021</option>
                            <option>2020</option>
                            <option>2019</option>
                            <option>2018</option>
                            <option>2017</option>
                            <option>2016</option>
                            <option>2015</option>
                        </select>
                    </div>
                </div>
            </section>
            <!-- SERVICE SELECTION -->
            <section class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
                <div class="mb-1 flex items-center gap-2">
                    <i class="fa-solid fa-screwdriver-wrench text-lg text-orange-500"></i>
                    <h2 class="text-base font-bold">Select Service Types</h2>
                </div>
                <p class="mb-4 text-xs text-gray-500">You can select multiple services for your vehicle.</p>
                <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-6">
                    <!-- ENGINE SERVICE -->
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="services[]" value="Engine Service" class="peer sr-only">
                        <div class="flex h-[105px] flex-col items-center justify-center rounded-lg border border-gray-200 bg-white px-1 text-center shadow-sm transition-all hover:border-orange-400 peer-checked:border-orange-500 peer-checked:bg-orange-50">
                            <i class="fa-solid fa-battery-full text-2xl text-gray-700 peer-checked:text-orange-500"></i>
                            <span class="mt-2 text-[11px] font-bold">Engine Service</span>
                            <span class="mt-1 text-[9px] text-gray-500">Engine check-up & tuning</span>
                        </div>
                        <span class="absolute right-2 top-2 hidden h-5 w-5 items-center justify-center rounded-full bg-orange-500 text-[10px] text-white peer-checked:flex">
                            <i class="fa-solid fa-check"></i>
                        </span>
                    </label>
                    <!-- WHEEL AND TYRE -->
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="services[]" value="Wheel and Tyre Service" class="peer sr-only">
                        <div class="flex h-[105px] flex-col items-center justify-center rounded-lg border border-gray-200 bg-white px-1 text-center shadow-sm transition-all hover:border-orange-400 peer-checked:border-orange-500 peer-checked:bg-orange-50">
                            <i class="fa-solid fa-life-ring text-2xl text-gray-700"></i>
                            <span class="mt-2 text-[11px] font-bold">Wheel & Tyre</span>
                            <span class="mt-1 text-[9px] text-gray-500">Tyre change & balancing</span>
                        </div>
                        <span class="absolute right-2 top-2 hidden h-5 w-5 items-center justify-center rounded-full bg-orange-500 text-[10px] text-white peer-checked:flex">
                            <i class="fa-solid fa-check"></i>
                        </span>
                    </label>
                    <!-- BRAKE REPAIR -->
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="services[]" value="Brake Repair" class="peer sr-only">
                        <div class="flex h-[105px] flex-col items-center justify-center rounded-lg border border-gray-200 bg-white px-1 text-center shadow-sm transition-all hover:border-orange-400 peer-checked:border-orange-500 peer-checked:bg-orange-50">
                            <i class="fa-solid fa-compact-disc text-2xl text-gray-700"></i>
                            <span class="mt-2 text-[11px] font-bold">Brake Repair</span>
                            <span class="mt-1 text-[9px] text-gray-500">Inspection & replacement</span>
                        </div>
                        <span class="absolute right-2 top-2 hidden h-5 w-5 items-center justify-center rounded-full bg-orange-500 text-[10px] text-white peer-checked:flex">
                            <i class="fa-solid fa-check"></i>
                        </span>
                    </label>
                    <!-- VEHICLE CLEANING -->
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="services[]" value="Vehicle Cleaning" class="peer sr-only">
                        <div class="flex h-[105px] flex-col items-center justify-center rounded-lg border border-gray-200 bg-white px-1 text-center shadow-sm transition-all hover:border-orange-400 peer-checked:border-orange-500 peer-checked:bg-orange-50">
                            <i class="fa-solid fa-car text-2xl text-gray-700"></i>
                            <span class="mt-2 text-[11px] font-bold">Vehicle Cleaning</span>
                            <span class="mt-1 text-[9px] text-gray-500">Interior & exterior cleaning</span>
                        </div>
                        <span class="absolute right-2 top-2 hidden h-5 w-5 items-center justify-center rounded-full bg-orange-500 text-[10px] text-white peer-checked:flex">
                            <i class="fa-solid fa-check"></i>
                        </span>
                    </label>
                    <!-- BATTERY SERVICE -->
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="services[]" value="Battery Service" class="peer sr-only">
                        <div class="flex h-[105px] flex-col items-center justify-center rounded-lg border border-gray-200 bg-white px-1 text-center shadow-sm transition-all hover:border-orange-400 peer-checked:border-orange-500 peer-checked:bg-orange-50">
                            <i class="fa-solid fa-car-battery text-2xl text-gray-700"></i>
                            <span class="mt-2 text-[11px] font-bold">Battery Service</span>
                            <span class="mt-1 text-[9px] text-gray-500">Battery check & replacement</span>
                        </div>
                        <span class="absolute right-2 top-2 hidden h-5 w-5 items-center justify-center rounded-full bg-orange-500 text-[10px] text-white peer-checked:flex">
                            <i class="fa-solid fa-check"></i>
                        </span>
                    </label>
                    <!-- AC SERVICE -->
                    <label class="relative cursor-pointer">
                        <input type="checkbox" name="services[]" value="AC Service" class="peer sr-only">
                        <div class="flex h-[105px] flex-col items-center justify-center rounded-lg border border-gray-200 bg-white px-1 text-center shadow-sm transition-all hover:border-orange-400 peer-checked:border-orange-500 peer-checked:bg-orange-50">
                            <i class="fa-solid fa-snowflake text-2xl text-gray-700"></i>
                            <span class="mt-2 text-[11px] font-bold">AC Service</span>
                            <span class="mt-1 text-[9px] text-gray-500">Cooling system service</span>
                        </div>
                        <span class="absolute right-2 top-2 hidden h-5 w-5 items-center justify-center rounded-full bg-orange-500 text-[10px] text-white peer-checked:flex">
                            <i class="fa-solid fa-check"></i>
                        </span>
                    </label>
                </div>
            </section>
            <!-- DATE, TIME AND NOTES -->
            <section class="grid grid-cols-1 gap-4 md:grid-cols-3">
                <!-- DATE -->
                <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
                    <h2 class="mb-4 flex items-center gap-2 text-base font-bold">
                        <i class="fa-regular fa-calendar-days text-orange-500"></i>
                        Choose Date
                    </h2>
                    <label for="appointment_date" class="mb-2 block text-xs font-semibold">Appointment Date <span class="text-red-500">*</span></label>
                    <div class="flex h-10 items-center gap-2 rounded-lg border border-gray-300 px-3 focus-within:border-orange-500">
                        <i class="fa-regular fa-calendar text-gray-400"></i>
                        <input type="date" id="appointment_date" name="appointment_date" min="2026-11-01" required class="w-full bg-transparent text-xs outline-none">
                    </div>
                </div>
                <!-- TIME -->
                <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
                    <h2 class="mb-4 flex items-center gap-2 text-base font-bold">
                        <i class="fa-regular fa-clock text-orange-500"></i>
                        Select Time
                    </h2>
                    <p class="mb-3 text-xs text-gray-500">Choose your preferred appointment time.</p>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="appointment_time" value="09:00 AM" required class="peer sr-only">
                            <span class="flex h-9 items-center justify-center rounded-full border border-gray-200 text-[10px] font-medium transition peer-checked:border-orange-500 peer-checked:bg-orange-500 peer-checked:text-white hover:border-orange-400">09:00 AM</span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="appointment_time" value="09:30 AM" class="peer sr-only">
                            <span class="flex h-9 items-center justify-center rounded-full border border-gray-200 text-[10px] font-medium transition peer-checked:border-orange-500 peer-checked:bg-orange-500 peer-checked:text-white hover:border-orange-400">09:30 AM</span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="appointment_time" value="10:00 AM" class="peer sr-only">
                            <span class="flex h-9 items-center justify-center rounded-full border border-gray-200 text-[10px] font-medium transition peer-checked:border-orange-500 peer-checked:bg-orange-500 peer-checked:text-white hover:border-orange-400">10:00 AM</span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="appointment_time" value="10:30 AM" class="peer sr-only">
                            <span class="flex h-9 items-center justify-center rounded-full border border-gray-200 text-[10px] font-medium transition peer-checked:border-orange-500 peer-checked:bg-orange-500 peer-checked:text-white hover:border-orange-400">10:30 AM</span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="appointment_time" value="11:00 AM" class="peer sr-only">
                            <span class="flex h-9 items-center justify-center rounded-full border border-gray-200 text-[10px] font-medium transition peer-checked:border-orange-500 peer-checked:bg-orange-500 peer-checked:text-white hover:border-orange-400">11:00 AM</span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="appointment_time" value="11:30 AM" class="peer sr-only">
                            <span class="flex h-9 items-center justify-center rounded-full border border-gray-200 text-[10px] font-medium transition peer-checked:border-orange-500 peer-checked:bg-orange-500 peer-checked:text-white hover:border-orange-400">11:30 AM</span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="appointment_time" value="02:00 PM" class="peer sr-only">
                            <span class="flex h-9 items-center justify-center rounded-full border border-gray-200 text-[10px] font-medium transition peer-checked:border-orange-500 peer-checked:bg-orange-500 peer-checked:text-white hover:border-orange-400">02:00 PM</span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="appointment_time" value="02:30 PM" class="peer sr-only">
                            <span class="flex h-9 items-center justify-center rounded-full border border-gray-200 text-[10px] font-medium transition peer-checked:border-orange-500 peer-checked:bg-orange-500 peer-checked:text-white hover:border-orange-400">02:30 PM</span>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="appointment_time" value="03:00 PM" class="peer sr-only">
                            <span class="flex h-9 items-center justify-center rounded-full border border-gray-200 text-[10px] font-medium transition peer-checked:border-orange-500 peer-checked:bg-orange-500 peer-checked:text-white hover:border-orange-400">03:00 PM</span>
                        </label>
                    </div>
                </div>
                <!-- ADDITIONAL NOTES -->
                <div class="rounded-xl border border-gray-200 bg-white p-4 shadow-sm">
                    <h2 class="mb-4 flex items-center gap-2 text-base font-bold">
                        <i class="fa-regular fa-rectangle-list text-orange-500"></i>
                        Additional Notes
                    </h2>
                    <label for="additional_note" class="mb-2 block text-xs font-semibold">Describe the problem (Optional)</label>
                    <textarea id="additional_note" name="additional_note" maxlength="200" rows="5" placeholder="Describe any problems with your vehicle..." class="w-full resize-none rounded-lg border border-gray-300 p-3 text-xs leading-5 outline-none placeholder:text-gray-400 focus:border-orange-500"></textarea>
                    <p class="mt-1 text-right text-[10px] text-gray-400">Maximum 200 characters</p>
                </div>
            </section>
            <!-- FORM BUTTONS -->
            <div class="flex flex-col-reverse justify-between gap-3 sm:flex-row sm:items-center">
                <a href="homepage.html" class="flex h-11 items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white px-6 text-xs font-semibold text-gray-600 shadow-sm transition hover:bg-gray-100">
                    <i class="fa-solid fa-arrow-left"></i>Cancel                       
                </a>
                <button type="submit" class="flex h-11 items-center justify-center gap-3 rounded-lg bg-orange-500 px-10 text-xs font-bold text-white shadow-sm transition hover:bg-orange-600 sm:min-w-[270px]">
                    Next Step
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </form>
    </main>
</body>
</html>
